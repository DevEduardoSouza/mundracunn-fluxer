# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Build do fork MUNDRACUNN: gera a imagem fluxer-api (API + worker) a partir
# de fluxer_api/Dockerfile e publica no GHCR desta conta. A VPS puxa a tag
# :mundracunn via timer (pull-based, sem SSH de entrada) e recria api + worker.
#
# Irmao do mundracunn-deploy-app.yaml (app-proxy). Sem esta imagem, producao
# roda a API OFICIAL (ghcr.io/fluxerapp/fluxer-api:v1) e nenhuma mudanca de
# backend do fork chega ao servidor.
name: mundracunn deploy api

on:
  push:
    branches: [main]
    paths:
      - "fluxer_api/**"
      - "packages/**"
      - "patches/**"
      - "tsconfigs/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/mundracunn-deploy-api.yaml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: mundracunn-deploy-api
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: fluxer_api/Dockerfile
          push: true
          provenance: false
          platforms: linux/amd64
          tags: |
            ghcr.io/deveduardosouza/fluxer-api:mundracunn
            ghcr.io/deveduardosouza/fluxer-api:sha-${{ github.sha }}
          build-args: |
            BUILD_VERSION=mundracunn-${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
        env:
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
