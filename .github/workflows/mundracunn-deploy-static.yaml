# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Build do fork MUNDRACUNN: gera a imagem fluxer-static (avatares padrao,
# favicons, icones) e publica no GHCR desta conta.
#
# Existe porque os assets de marca vivem nesse pacote: o avatar padrao de
# quem ainda nao escolheu foto e o icone que o WhatsApp usa no card do
# convite eram a logo do Fluxer. Ate 01/09/2026 a producao puxava a imagem
# OFICIAL (ghcr.io/fluxerapp/fluxer-static:v1), entao nao havia como trocar
# essas artes sem buildar a nossa.
#
# Mesma forma do mundracunn-deploy-app.yaml: single-arch amd64 num runner
# padrao, sem CalVer nem GitHub Release. Os assets sao estaticos, entao o
# build e rapido e so dispara quando algo em fluxer_static muda.
name: mundracunn deploy static

on:
  push:
    branches: [main]
    paths:
      - "fluxer_static/**"
      - ".github/workflows/mundracunn-deploy-static.yaml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: mundracunn-deploy-static
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: fluxer_static/Dockerfile
          push: true
          provenance: false
          platforms: linux/amd64
          tags: |
            ghcr.io/deveduardosouza/fluxer-static:mundracunn
            ghcr.io/deveduardosouza/fluxer-static:sha-${{ github.sha }}
          build-args: |
            BUILD_VERSION=mundracunn-${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
        env:
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
